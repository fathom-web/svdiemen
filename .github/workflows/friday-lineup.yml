name: FootballForge – vrijdag 11:00 opstellingen

on:
  schedule:
    # Amsterdam local time: works through summer and winter time.
    # At 11:00 and retries throughout late morning; existing plans are untouched.
    - cron: '0,15,30,45 11 * * 5'
      timezone: 'Europe/Amsterdam'
    - cron: '0,15 12 * * 5'
      timezone: 'Europe/Amsterdam'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Test without changing Supabase'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: footballforge-friday-lineup
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
      - name: Generate Saturday match plans for all three teams
        env:
          SUPABASE_URL: https://pfvahwhoyicnzwnwspaf.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_Grzkc4HIqZ1gN1sktI2glQ_s9DWLAVy
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: node scripts/friday-lineup.cjs
